spring.application.name=oficina-mecanica-api
server.port=${PORT:8081}

# ---------- Firebase (Cloud Firestore) ----------
# ID do projeto no console do Firebase (Configurações do projeto > Geral)
firebase.project-id=${FIREBASE_PROJECT_ID:oficina-mecanica-6bf70}
# Caminho do arquivo da conta de serviço (NUNCA envie este arquivo para o GitHub)
firebase.credenciais=${FIREBASE_CREDENCIAIS:firebase-credenciais.json}
# Alternativa para deploy: conteúdo do JSON em uma variável de ambiente
firebase.credenciais-json=${FIREBASE_CREDENTIALS_JSON:}

# ---------- Segurança ----------
seguranca.jwt.segredo=${JWT_SEGREDO:troque-este-segredo-por-um-valor-aleatorio-de-32+-caracteres}
seguranca.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
seguranca.cors.origens=${CORS_ORIGENS:http://localhost:8081}
oficina.admin.login=${ADMIN_LOGIN:admin}
oficina.admin.senha=${ADMIN_SENHA:admin123}

# ---------- Automação ----------
# Lembrete de revisão: todos os dias às 08:00 (segundo minuto hora dia mês dia-da-semana)
oficina.lembrete-revisao.cron=${LEMBRETE_CRON:0 0 8 * * *}
oficina.demo.popular-dados=${DEMO_DADOS:true}

# ---------- Outros ----------
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.time-zone=America/Sao_Paulo
